// === MIGRATION: preserve old v5 picks → "interview" status in v6 ===
let status = JSON.parse(localStorage.getItem('aoo_status_v6') || '{}');
if (Object.keys(status).length === 0) {
  const oldPicks = JSON.parse(localStorage.getItem('aoo_picked_v5') || '[]');
  if (oldPicks.length > 0) {
    oldPicks.forEach(r => { status[r] = 'interview'; });
    localStorage.setItem('aoo_status_v6', JSON.stringify(status));
    console.log('Migrated ' + oldPicks.length + ' picks from v5 to v6');
  }
}

function saveStatus() {
  localStorage.setItem('aoo_status_v6', JSON.stringify(status));
}

function getStatus(rank) {
  return status[rank] || '';
}

function setStatus(rank, newStatus) {
  if (newStatus === '') delete status[rank];
  else status[rank] = newStatus;
  saveStatus();
}


// === Export / Import state as Excel ===
const STATE_HEADERS = ['#', 'ชื่อ', 'บริษัท',
  'สถานะคัด(interview/reject)', 'สถานะโทร(called/unable)',
  'จองเวลา(slot 1-30)', 'ผู้โทร(amp/em)', 'Notebook(Y/N)', 'ว่าง11มิย(Y/N)',
  'กลุ่ม1พุธ(Y/N)', 'กลุ่ม2จันทร์(Y/N)',
  'ผลคัด(pass/fail)', 'Comment', 'Prep'];

function exportData() {
  const screening = JSON.parse(localStorage.getItem('aoo_status_v6') || '{}');
  const call = JSON.parse(localStorage.getItem('aoo_call_status_v2') || '{}');
  const bookings = JSON.parse(localStorage.getItem('aoo_bookings_v1') || '{}');
  const checklist = JSON.parse(localStorage.getItem('aoo_checklist_v1') || '{}');
  const results = JSON.parse(localStorage.getItem('aoo_result_v1') || '{}');
  const comments = JSON.parse(localStorage.getItem('aoo_comments_v1') || '{}');
  const preps = JSON.parse(localStorage.getItem('aoo_prep_v1') || '{}');
  const callerData = JSON.parse(localStorage.getItem('aoo_caller_v1') || '{}');

  const allData = (typeof ALL_DATA !== 'undefined') ? ALL_DATA : DATA;
  const rows = [STATE_HEADERS];
  allData.forEach(d => {
    const c = checklist[d.rank] || {};
    rows.push([
      d.rank,
      `${d.prefix||''}${d.name||''}`,
      d.biz || '',
      screening[d.rank] || '',
      call[d.rank] || '',
      bookings[d.rank] || '',
      callerData[d.rank] || '',
      c.nb ? 'Y' : '',
      c.open ? 'Y' : '',
      (c.g1 || c.group === '1') ? 'Y' : '',
      (c.g2 || c.group === '2') ? 'Y' : '',
      results[d.rank] || '',
      comments[d.rank] || '',
      preps[d.rank] || '',
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = STATE_HEADERS.map((h, i) => {
    const lens = rows.map(row => String(row[i] || '').length);
    return {wch: Math.min(50, Math.max(8, ...lens))};
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'State');
  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `aoo-dip-state-${date}.xlsx`);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, {type: 'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''});
        if (rows.length < 2) { alert('ไฟล์ว่างหรือไม่ถูกต้อง'); return; }

        if (!confirm(`นำเข้าข้อมูล ${rows.length-1} แถว — ข้อมูลปัจจุบันจะถูกเขียนทับ?`)) return;

        const screening = {}, call = {}, bookings = {}, checklist = {},
              results = {}, comments = {}, preps = {}, callerImport = {};
        let imported = 0;
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          const rank = parseInt(r[0]);
          if (!rank) continue;
          imported++;
          if (r[3]) screening[rank] = String(r[3]).trim();
          if (r[4]) call[rank] = String(r[4]).trim();
          if (r[5]) bookings[rank] = String(r[5]).trim();
          if (r[6]) callerImport[rank] = String(r[6]).trim();
          const c = {};
          if (String(r[7]).toUpperCase() === 'Y') c.nb = true;
          if (String(r[8]).toUpperCase() === 'Y') c.open = true;
          if (String(r[9]).toUpperCase() === 'Y') c.g1 = true;
          if (String(r[10]).toUpperCase() === 'Y') c.g2 = true;
          if (Object.keys(c).length > 0) checklist[rank] = c;
          if (r[11]) results[rank] = String(r[11]).trim();
          if (r[12]) comments[rank] = String(r[12]);
          if (r[13]) preps[rank] = String(r[13]);
        }

        localStorage.setItem('aoo_status_v6', JSON.stringify(screening));
        localStorage.setItem('aoo_call_status_v2', JSON.stringify(call));
        localStorage.setItem('aoo_bookings_v1', JSON.stringify(bookings));
        localStorage.setItem('aoo_checklist_v1', JSON.stringify(checklist));
        localStorage.setItem('aoo_result_v1', JSON.stringify(results));
        localStorage.setItem('aoo_comments_v1', JSON.stringify(comments));
        localStorage.setItem('aoo_prep_v1', JSON.stringify(preps));
        localStorage.setItem('aoo_caller_v1', JSON.stringify(callerImport));

        alert(`นำเข้าสำเร็จ ${imported} แถว — รีเฟรชหน้าเว็บ`);
        location.reload();
      } catch (err) {
        alert('ไฟล์ไม่ถูกต้อง: ' + err.message);
        console.error(err);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}


function scoreClass(s) {
  if (s === 10) return 's10';
  if (s === 9) return 's9';
  if (s >= 7) return 's78';
  if (s >= 5) return 's56';
  if (s >= 3) return 's34';
  return 's02';
}

function hasWeb(w) {
  if (!w) return false;
  const x = w.trim().toLowerCase();
  return x && !['-','ไม่มี','ไม่มีค่ะ','ไม่มีครับ','no website','ยังไม่มี','ยังไม่มีค่ะ','สร้างไม่สำเร็จ'].includes(x)
    && !x.startsWith('ไม่มี');
}

function normalizeUrl(u) {
  if (!u) return '';
  u = u.trim();
  if (!u.startsWith('http')) return 'https://' + u;
  return u;
}

function formatPhone(p) {
  if (!p) return '';
  let x = String(p).replace(/^[=+]+/, '').trim();
  if (x.startsWith('66')) x = '0' + x.slice(2);
  return x;
}
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseChannels(chStr) {
  if (!chStr) return [];
  return chStr.split(/[,;|/]/).map(x => x.trim().toLowerCase()).filter(Boolean);
}

function channelType(c) {
  c = c.toLowerCase();
  if (c.includes('facebook') || c === 'fb') return 'fb';
  if (c.includes('line')) return 'line';
  if (c.includes('shopee')) return 'shopee';
  if (c.includes('lazada')) return 'lazada';
  if (c.includes('tiktok') || c.includes('tik tok')) return 'tiktok';
  if (c.includes('instagram') || c === 'ig') return 'ig';
  if (c.includes('website') || c.includes('เว็บ') || c.includes('web')) return 'web';
  return 'other';
}

function channelLabel(t) {
  return {fb:'Facebook', line:'LINE', shopee:'Shopee', lazada:'Lazada',
          tiktok:'TikTok', ig:'IG', web:'Web', other:'อื่นๆ'}[t];
}

function searchUrl(platform, bizName) {
  const q = encodeURIComponent(bizName);
  if (platform === 'fb') return `https://www.facebook.com/search/top?q=${q}`;
  if (platform === 'shopee') return `https://shopee.co.th/search?keyword=${q}`;
  if (platform === 'lazada') return `https://www.lazada.co.th/catalog/?q=${q}`;
  if (platform === 'tiktok') return `https://www.tiktok.com/search?q=${q}`;
  if (platform === 'ig') return `https://www.instagram.com/explore/search/keyword/?q=${q}`;
  if (platform === 'line') return `https://www.google.com/search?q=${q}+line+official`;
  return `https://www.google.com/search?q=${q}`;
}

const expanded = new Set();
let sortKey = 'rank';
let sortAsc = true;
let currentFilter = 'all';
let currentSearch = '';
let currentProvince = '';

function getSortedData() {
  const arr = [...DATA];
  arr.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });
  return arr;
}

function renderChannelChips(channels) {
  if (!channels || channels.length === 0) return '<span style="color:#999;font-size:11px">-</span>';
  return channels.map(c => {
    const t = channelType(c);
    return `<span class="ch ${t}">${channelLabel(t)}</span>`;
  }).join('');
}

function renderChannelLinks(d) {
  const channels = parseChannels(d.channels);
  const items = [];
  const seen = new Set();

  if (d.fb) {
    items.push(`<a class="ch-link fb" href="${normalizeUrl(d.fb)}" target="_blank">📘 Facebook (ตรง)</a>`);
    seen.add('fb');
  }
  if (hasWeb(d.web)) {
    items.push(`<a class="ch-link web" href="${normalizeUrl(d.web)}" target="_blank">🌐 Website</a>`);
    seen.add('web');
  }
  channels.forEach(c => {
    const t = channelType(c);
    if (seen.has(t)) return;
    seen.add(t);
    const url = searchUrl(t, d.biz);
    items.push(`<a class="ch-link ${t} search-only" href="${url}" target="_blank">${channelLabel(t)} (ค้นหา)</a>`);
  });

  if (items.length === 0) return '<i style="color:#999">ไม่ระบุช่องทาง</i>';
  return items.join(' ');
}

function statusButtons(rank) {
  const s = getStatus(rank);
  return `
    <div class="status-group" onclick="event.stopPropagation()">
      <button class="status-btn interview ${s==='interview'?'active':''}" data-status="interview" data-rank="${rank}" title="เข้าสัมภาษณ์">✓</button>
      <button class="status-btn reject ${s==='reject'?'active':''}" data-status="reject" data-rank="${rank}" title="ไม่น่าสนใจ">✗</button>
    </div>
  `;
}

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  const sorted = getSortedData();
  let insertedDivider = false;

  sorted.forEach((d) => {
    if (sortKey === 'rank' && sortAsc && !insertedDivider && d.rank === 51) {
      const tr = document.createElement('tr');
      tr.className = 'divider-row';
      tr.innerHTML = `<td colspan="11">─── เส้นแบ่ง Top 50 ───</td>`;
      tbody.appendChild(tr);
      insertedDivider = true;
    }

    const channels = parseChannels(d.channels);
    const s = getStatus(d.rank);
    const tr = document.createElement('tr');
    tr.className = s ? 'status-' + s : '';
    tr.dataset.rank = d.rank;
    tr.dataset.score = d.score;
    tr.dataset.status = s;
    tr.dataset.ai = d.ai_suspect ? '1' : '0';
    tr.dataset.hasWeb = hasWeb(d.web) ? '1' : '0';
    tr.dataset.province = d.province || '';
    tr.dataset.search = (d.name + ' ' + d.biz + ' ' + d.reason + ' ' + d.address).toLowerCase();

    const aiBadge = d.ai_suspect ? `<span class="ai-mini">AI</span>` : '';
    const webTag = hasWeb(d.web)
      ? `<span class="web-tag yes">มี</span>`
      : `<span class="web-tag no">ไม่มี</span>`;

    tr.innerHTML = `
      <td class="status-cell">${statusButtons(d.rank)}</td>
      <td class="center">${d.rank}</td>
      <td class="center"><span class="score-pill ${scoreClass(d.score)}">${d.score}</span>${aiBadge}</td>
      <td class="name-cell">${d.prefix}${d.name}${d.image_url ? ` <a href="${d.image_url}" target="_blank" title="ดูรูปสินค้า" onclick="event.stopPropagation()" style="text-decoration:none;font-size:14px;">📷</a>` : ''}</td>
      <td class="biz-cell">${d.biz}</td>
      <td class="hide-mobile position-cell">${d.position || '-'}</td>
      <td class="province-cell">${d.province || '-'}</td>
      <td class="hide-mobile rev-cell">${d.rev_short || '-'}</td>
      <td class="hide-mobile channels-cell">${renderChannelChips(channels)}</td>
      <td class="hide-mobile center">${d.age !== null ? d.age : '?'}</td>
      <td class="center">${webTag}</td>
    `;
    tr.onclick = () => toggleExpand(d.rank);
    tbody.appendChild(tr);

    if (expanded.has(d.rank)) {
      tbody.appendChild(buildExpandRow(d));
    }
  });

  attachStatusHandlers();
  updateStats();
}

function buildExpandRow(d) {
  const tr = document.createElement('tr');
  tr.className = 'expand-row';
  const aiClass = d.ai_suspect ? ' ai-bg' : '';
  tr.innerHTML = `
    <td colspan="11">
      <div class="expand-content${aiClass}">
        <h4>📍 ติดต่อ + ข้อมูลบริษัท</h4>
        <div class="info-grid">
          <b>ตำแหน่ง:</b><span>${escapeHtml(d.position) || '-'} ${d.department ? ' / ' + escapeHtml(d.department) : ''}</span>
          <b>รูปสินค้า:</b><span>${d.image_url ? `<a href="${d.image_url}" target="_blank">📷 ${escapeHtml(d.image_name)}</a>` : '<i>ไม่มี</i>'}</span>
          <b>รายได้/ปี:</b><span style="font-weight:600;color:var(--accent)">${escapeHtml(d.revenue) || '-'}</span>
          <b>ที่อยู่:</b><span>${escapeHtml(d.address) || '-'}</span>
          <b>โทร:</b><span><a href="tel:${formatPhone(d.phone)}">${formatPhone(d.phone)}</a></span>
          <b>Email:</b><span><a href="mailto:${d.email}">${escapeHtml(d.email)}</a></span>
          <b>หมายเหตุ:</b><span>${escapeHtml(d.note)}</span>
        </div>
        <h4>🔗 ช่องทางสื่อ (คลิกเพื่อเปิด)</h4>
        <div class="channel-links">${renderChannelLinks(d)}</div>
        <h4>💬 เหตุผลที่ต้องมีเว็บไซต์${d.ai_suspect ? ' <span class="ai-tag">น่าจะใช้ AI เขียน</span>' : ''}</h4>
        <div class="reason-text">${escapeHtml(d.reason)}</div>
      </div>
    </td>
  `;
  return tr;
}

function toggleExpand(rank) {
  if (expanded.has(rank)) expanded.delete(rank);
  else expanded.add(rank);
  render();
}

function attachStatusHandlers() {
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const rank = parseInt(btn.dataset.rank);
      const newStatus = btn.dataset.status;
      const currentStatus = getStatus(rank);
      // Click same button again = clear
      const target = currentStatus === newStatus ? '' : newStatus;
      setStatus(rank, target);
      // Update UI in place
      const group = btn.parentElement;
      group.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
      if (target) {
        group.querySelector(`[data-status="${target}"]`).classList.add('active');
      }
      const tr = btn.closest('tr');
      tr.classList.remove('status-interview', 'status-reject');
      if (target) tr.classList.add('status-' + target);
      tr.dataset.status = target;
      updateStats();
    };
  });
}

function applyFilter() {
  const rows = document.querySelectorAll('tbody tr:not(.expand-row):not(.divider-row)');
  let visible = 0;
  rows.forEach(r => {
    const score = parseInt(r.dataset.score);
    const rank = parseInt(r.dataset.rank);
    const hw = r.dataset.hasWeb === '1';
    const ai = r.dataset.ai === '1';
    const prov = r.dataset.province;
    const txt = r.dataset.search;
    const st = r.dataset.status;
    let pass = true;
    if (currentFilter === 'unchecked') pass = !st;
    else if (currentFilter === 'interview') pass = st === 'interview';
    else if (currentFilter === 'reject') pass = st === 'reject';
    else if (currentFilter === 'top50') pass = rank <= 50;
    else if (currentFilter === '9') pass = score >= 9;
    else if (currentFilter === '78') pass = score >= 7 && score < 9;
    else if (currentFilter === 'hideai') pass = !ai;
    else if (currentFilter === 'noweb') pass = !hw;
    if (pass && currentSearch) pass = txt.includes(currentSearch);
    if (pass && currentProvince) pass = prov === currentProvince;
    r.style.display = pass ? '' : 'none';
    const next = r.nextElementSibling;
    if (next && next.classList.contains('expand-row')) {
      next.style.display = pass ? '' : 'none';
    }
    if (pass) visible++;
  });
  document.getElementById('visible-count').textContent = visible;
}

function updateStats() {
  let intCount = 0, rejCount = 0;
  Object.values(status).forEach(s => {
    if (s === 'interview') intCount++;
    else if (s === 'reject') rejCount++;
  });
  document.getElementById('int-count').textContent = intCount;
  document.getElementById('rej-count').textContent = rejCount;
  document.getElementById('unc-count').textContent = DATA.length - intCount - rejCount;
  applyFilter();
}

document.getElementById('search').oninput = (e) => {
  currentSearch = e.target.value.toLowerCase();
  applyFilter();
};

document.getElementById('province-filter').onchange = (e) => {
  currentProvince = e.target.value;
  applyFilter();
};

document.querySelectorAll('[data-filter]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.filter;
    applyFilter();
  };
});

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.sort;
    if (sortKey === k) sortAsc = !sortAsc;
    else {
      sortKey = k;
      sortAsc = (k === 'rank' || k === 'name' || k === 'biz' || k === 'province' || k === 'position');
    }
    document.querySelectorAll('.arrow').forEach(a => a.textContent = '');
    document.getElementById('arr-' + k).textContent = sortAsc ? '▲' : '▼';
    render();
  };
});

document.getElementById('clear-picks').onclick = () => {
  if (confirm('ล้างสถานะที่เลือกไว้ทั้งหมด? (ทั้ง ✓ และ ✗)')) {
    status = {};
    saveStatus();
    render();
  }
};

 TikTok, LINE) เหมือนเราไป \"เช่าแผงตลาด\" ในพื้นที่ของคนอื่น แต่การมีเว็บไซต์คือการ \"สร้างตึกหรือหน้าร้านบนที่ดินของเราเอง\"\nและนี่คือเหตุผลหลักว่าทำไมบริษัทถึง \"จำเป็น\" ต้องมีเว็บไซต์ครับ:\n1. สร้างความน่าเชื่อถือระดับมืออาชีพ (Credibility & Trust)\nสร้างความมั่นใจให้ลูกค้า: ปัจจุบันเวลาคนจะซื้อสินค้าหรือดีลธุรกิจ (โดยเฉพาะแบบ B2B หรือสินค้ามูลค่าสูง) สิ่งแรกที่พวกเขาทำคือการเอาชื่อบริษัทไปเสิร์ชบน Google ถ้าเสิร์ชแล้วเจอเว็บไซต์ทางการที่มีข้อมูลชัดเจน มีประวัติความเป็นมา มีที่ตั้ง มีเบอร์ติดต่อ จะช่วยเพิ่มความน่าเชื่อถือขึ้นมหาศาล\nดูเป็นมืออาชีพกว่าคู่แข่ง: บ่อยครั้งที่ลูกค้าเกิดความลังเลใจระหว่างสองบริษัท แต่ตัดสินใจเลือกบริษัทที่มีเว็บไซต์ เพราะมันแสดงถึงความมั่นคงและความตั้งใจในการทำธุรกิจในระยะยาว\n2. เป็นเจ้าของข้อมูลและพื้นที่ 100% (Own Media)\nควบคุมทุกอย่างได้เอง: บนเว็บไซต์ เราสามารถดีไซน์ จัดหมวดหมู่สินค้า หรือเล่าเรื่องราวของแบรนด์ (Brand Storytelling) ได้อย่างไร้ข้อจำกัด ไม่ต้องกลัวว่าแพลตฟอร์มจะเปลี่ยนกฎ หรือปรับลดการมองเห็น (Algorithm Change)\nปลอดภัยจากการโดนปิดกั้น: ถ้าเราพึ่งพาแต่ Social Media วันดีคืนดีเพจโดนแฮก โดนแบน หรือระบบล่ม ลูกค้าจะติดต่อเราไม่ได้ทันที แต่เว็บไซต์คือสินทรัพย์ดิจิทัล (Digital Asset) ที่เป็นของเราอย่างแท้จริง\n3. เปิดหน้าร้านทำงานแทนเราตลอด 24 ชั่วโมง (24/7 Availability)\nเว็บไซต์ไม่มีวันหยุด ไม่มีเวลาปิดทำการ ลูกค้าสามารถเข้ามาศึกษาข้อมูล ดูแคตตาล็อกสินค้า หรือกดสั่งซื้อและชำระเงินได้ตลอดเวลา แม้ในเวลาที่เรากำลังนอนหลับ หรือเป็นช่วงวันหยุดยาวของบริษัทก็ตาม\n4. ดึงดูดลูกค้าใหม่ผ่าน Google (SEO - Search Engine Optimization)\nพฤติกรรมของคนที่ \"ค้นหา\" บน Google คือคนที่มี \"ความต้องการ (Intent)\" ในสินค้านั้นๆ อยู่แล้ว ถ้าเราทำเว็บไซต์ให้ติดหน้าแรกของ Google ในคีย์เวิร์ดที่เกี่ยวข้องกับธุรกิจ เราจะได้ลูกค้าใหม่ๆ ที่พร้อมซื้อวิ่งเข้ามาหาเองโดยตรง โดยไม่ต้องเสียเงินค่ายิงแอดตลอดเวลา\n5. การเก็บข้อมูลและการทำการตลาดที่แม่นยำ (Data & Tracking)\nเราสามารถติดเครื่องมือคอยเก็บสถิติ (เช่น Google Analytics) เพื่อดูพฤติกรรมของคนที่เข้ามาในเว็บได้ เช่น พวกเขาชอบอ่านหน้าไหนเป็นพิเศษ อยู่ในเว็บนานเท่าไหร่\nสามารถทำ Remarketing (การยิงโฆษณาซ้ำไปหาคนที่เคยเข้าเว็บ) ผ่านแพลตฟอร์มต่างๆ ได้แม่นยำมาก ทำให้งบการตลาดถูกใช้อย่างคุ้มค่าที่สุด\n6. ศูนย์รวมข้อมูลและปิดการขาย (Hub of Communication)\nไม่ว่าเราจะทำคอนเทนต์ใน Facebook, TikTok หรือยิงแอดช่องทางไหนก็ตาม เว็บไซต์จะเป็น \"ปลายทาง\" หรือ Landing Page ที่ดีที่สุดในการรวบรวมรายละเอียดทั้งหมด เพื่อส่งลูกค้าไปสู่ขั้นตอนการปิดการขาย (เช่น ปุ่มแอด LINE, ฟอร์มกรอกข้อมูล หรือระบบตะกร้าสินค้า)\nสรุปสั้นๆ: Social Media เหมาะกับการสร้างกระแส สร้างการรับรู้ และหาลูกค้าอย่างรวดเร็ว ส่วน Website เหมาะกับการสร้างความน่าเชื่อถือ เก็บฐานข้อมูล และสร้างยอดขายที่ยั่งยืนในระยะยาว การมีทั้งสองอย่างควบคู่กันจึงเป็นกลยุทธ์ที่ดีที่สุดครับ", null, "www.dollysolutions.co.th", "ยินยอม", "https://odgvpjcdaoscwrjpgajk.supabase.co/storage/v1/object/public/aooform-images/ffa30cec-1417-4541-a512-58189c621d90/responses/1779204179329-IMG_3357.jpeg", "รับทราบ", "ข้าพเจ้ายินยอมให้บริษัท เอโอโอ คอมเมิรซ์ จำกัด เก็บและใช้ข้อมูลส่วนบุคคลของข้าพเจ้า เพื่อการติดต่อ ประสานงาน และดำเนินการจัดกิจกรรมตามที่ระบุไว้เท่านั้น", null, true, false, null], "44": ["2026-05-20", "นาย", "สิทธิเกียรติ", "สุจิตรานนท์", "1102800050052", "1995-03-09", "66992828286", "mike@draftman.co", "728 เอกชัย บางบอน กทม 10150", "บริษัท อิมแพ็ค เอ็กซิบิชั่น แมเนจเม้นท์ จำกัด", "125542006506", "47/569-576 อาคารบางกอกแลนด์ ชั้นที่ 10 หมู่ที่ 3 ถนนป๊อปปูล่า 3 ตำบลบ้านใหม่ อำเภอปากเกร็ด จ.นนทบุรี 11120", "นนทบุรี", "ภาคบริการ", "HR Software", "Software as a Service สำหรับ HR ในองค์กร เช่น Payroll หรือ Staff Management", "Website", "ผู้จัดการฝ่ายบุคคล", "HR Data Analysis", "5,000,001 บาทขึ้นไป", "ขนาดใหญ่ (Large) - รายได้เกิน 500 ลบ. (สำหรับภาคผลิต)/ เกิน 300 ลบ. (สำหรับภาคบริการ การค้า)", "มากกว่า 10 ปี", "เอาไว้คัด Candidate ตอนสมัครงานกับทาง Impact ช่วยลด Process ในการคัดหาคนแบบ Manual", "https://web.facebook.com/IMPACTVenue/?_rdc=1&_rdr#", "https://im-challenger.hr-impact.co/", "ยินยอม", "https://odgvpjcdaoscwrjpgajk.supabase.co/storage/v1/object/public/aooform-images/ffa30cec-1417-4541-a512-58189c621d90/responses/1779   const textCols = [4, 6, 10]; // 0-indexed
  for (let i = 1; i < rows.length; i++) {
    textCols.forEach(c => {
      const cellRef = XLSX.utils.encode_cell({r: i, c: c});
      if (ws[cellRef]) {
        ws[cellRef].t = 's';
        ws[cellRef].v = String(ws[cellRef].v || '');
      }
    });
  }
  // Column widths
  ws['!cols'] = headers.map((h, i) => {
    const lens = rows.map(row => String(row[i] || '').length);
    const maxLen = Math.min(60, Math.max(10, ...lens));
    return {wch: maxLen};
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Interview Picks');

  const date = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `AOO DIP - Interview Picks ${interviewRanks.length}คน ${date}.xlsx`);
};


document.getElementById('btn-export-data').onclick = exportData;
document.getElementById('btn-import-data').onclick = importData;

render();
</script>
</body>
</html>
